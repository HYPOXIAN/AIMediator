[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aimediator"
version = "0.1.0"
description = "Evidence-linked analysis of English and Chinese Street Fighter 6 player feedback with local LLMs"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wanlin Young (Camille Yang)" }]
keywords = ["llm", "ollama", "nlp", "bilingual", "feedback-analysis", "street-fighter-6", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: English",
    "Natural Language :: Chinese (Simplified)",
]
dependencies = ["numpy>=1.23.5,<3"]
readme = "README.md"

[project.urls]
Homepage = "https://github.com/HYPOXIAN/AIMediator"
Repository = "https://github.com/HYPOXIAN/AIMediator"
Issues = "https://github.com/HYPOXIAN/AIMediator/issues"

[project.scripts]
aimediator = "aimediator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aimediator = ["assets/*.json", "assets/prompts/*.txt", "assets/configs/*.json", "assets/data/*.json", "assets/fixtures/*.json"]
